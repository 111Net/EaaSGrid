name: XaaSGrid Validation

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Node Setup
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Repository Validation
      run: |
        echo "XaaSGrid repository validation"

    - name: Docker Validation
      run: |
        docker --version

