services:

  xaasgrid-api:

    build:
      context: ./apps/api

    container_name: xaasgrid-api

    env_file:
      - .env

    ports:
      - "4000:4000"

    environment:

      NODE_ENV: production

      REDIS_URL: redis://xaasgrid-redis:6379

      DATABASE_URL: ${DATABASE_URL}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:

      xaasgrid-postgres:
        condition: service_started

      xaasgrid-redis:
        condition: service_started

    restart: unless-stopped



  xaasgrid-dashboard:

    build:

      context: ./apps/dashboard

    container_name: xaasgrid-dashboard


    ports:

      - "3000:3000"


    environment:

      NODE_ENV: production


      INTERNAL_API_URL: http://xaasgrid-api:4000


    depends_on:

      - xaasgrid-api


    restart: unless-stopped




  xaasgrid-postgres:

    image: postgres:15

    container_name: xaasgrid-postgres


    env_file:

      - .env


    ports:

      - "5432:5432"


    volumes:

      - infrastructure_postgres_data:/var/lib/postgresql/data


    restart: unless-stopped




  xaasgrid-redis:

    image: redis:7

    container_name: xaasgrid-redis


    ports:

      - "6379:6379"


    restart: unless-stopped





volumes:

  infrastructure_postgres_data:
