services:

  xaasgrid-postgres:

    image: postgres:15

    container_name: xaasgrid-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - infrastructure_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5



  xaasgrid-redis:

    image: redis:7

    container_name: xaasgrid-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5



  xaasgrid-api:

    build:
      context: ./apps/api

    container_name: xaasgrid-api

    restart: unless-stopped

    ports:
      - "4000:4000"

    environment:

      NODE_ENV: ${NODE_ENV:-production}

      PORT: 4000

      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: ${REDIS_URL}

      JWT_SECRET: ${JWT_SECRET}


    depends_on:

      xaasgrid-postgres:
        condition: service_healthy

      xaasgrid-redis:
        condition: service_healthy


    healthcheck:

      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:4000/api/ready"
        ]

      interval: 30s

      timeout: 10s

      retries: 3



  xaasgrid-dashboard:

    build:

      context: ./apps/dashboard


    container_name: xaasgrid-dashboard


    restart: unless-stopped


    ports:

      - "3000:3000"


    environment:

      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}


    depends_on:

      xaasgrid-api:

        condition: service_healthy



volumes:

  infrastructure_postgres_data:

    external: false
