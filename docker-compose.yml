services:

  xaasgrid-postgres:

    image: postgres:15

    container_name: xaasgrid-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}


    ports:

      - "5432:5432"


    volumes:

      - infrastructure_postgres_data:/var/lib/postgresql/data



  xaasgrid-redis:

    image: redis:7

    container_name: xaasgrid-redis

    restart: unless-stopped


    ports:

      - "6379:6379"



  xaasgrid-api:

    build:

      context: ./apps/api


    container_name: xaasgrid-api


    restart: unless-stopped


    ports:

      - "4000:4000"


    environment:

      NODE_ENV: ${NODE_ENV:-production}

      PORT: 4000

      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: ${REDIS_URL}

      JWT_SECRET: ${JWT_SECRET}



    depends_on:

      - xaasgrid-postgres

      - xaasgrid-redis



  xaasgrid-dashboard:


    build:

      context: ./apps/dashboard


    container_name: xaasgrid-dashboard


    restart: unless-stopped


    ports:

      - "3000:3000"



    environment:


      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}



    depends_on:

      - xaasgrid-api



volumes:


  infrastructure_postgres_data:


    external: false
